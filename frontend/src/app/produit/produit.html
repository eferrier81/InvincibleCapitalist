@if (prod(); as p) {
  <div class="produit panneau" [class.verrouille]="p.quantite === 0">
    <div class="produit-image" (click)="startFabrication()">
      <img class="round" [src]="gameService.logoUrl(p.logo)" [alt]="p.name" />
      <span class="quantite-badge">{{ p.quantite }}</span>
      @if (p.managerUnlocked) {
        <span class="manager-badge" title="Production automatisée" aria-label="Production automatisée">⚙</span>
      }
    </div>

    <div class="produit-info">
      <div class="produit-header">
        <span class="produit-name texte-titre">{{ p.name }}</span>
        <span class="produit-revenu chiffre" [innerHTML]="'+' + (gameService.revenuCycle(p) | bigvalue)"></span>
      </div>

      <div class="progressbar">
        <div class="fill" [style.width.%]="progress()"></div>
        @if (timeleft() > 0) {
          <span class="progress-label">{{ timeleft() | second }}</span>
        }
      </div>

      <button
        type="button"
        class="bouton-comic buy-button"
        [class.disabled]="!canBuy()"
        [disabled]="!canBuy()"
        (click)="buyProduct()"
      >
        Acheter {{ numberToBuy() }}
        <span [innerHTML]="'(' + (buyCost() | bigvalue) + ' $)'"></span>
      </button>
    </div>
  </div>
}
